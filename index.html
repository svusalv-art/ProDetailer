const rates = { GEL: 1, USD: 0.37, AZN: 0.63 };
const symbols = { GEL: '₾', USD: '$', AZN: '₼' };

const base = {
  polish:   { small: [180, 280], medium: [230, 350], large: [300, 450] },
  chemical: { small: [150, 250], medium: [200, 320], large: [260, 400] }
};

let lastRange = { lo: 250, hi: 400 }; // GEL-də saxlanır

function getEl(id){ return document.getElementById(id); }

function calc(){
  try {
    const s = getEl('service').value;
    const z = getEl('size').value;
    const c = getEl('condition').value;
    const l = getEl('level').value;

    let lo = 0, hi = 0;
    if (s === 'polish' || s === 'both') {
      lo += base.polish[z][0];
      hi += base.polish[z][1];
    }
    if (s === 'chemical' || s === 'both') {
      lo += base.chemical[z][0];
      hi += base.chemical[z][1];
    }

    const cf = ({normal:1, dirty:1.25, hard:1.25})[c] || 1;
    const lf = (s === 'chemical') ? 1 : ({one:1, two:1.35, three:1.7})[l] || 1;

    lo = Math.round(lo * cf * lf);
    hi = Math.round(hi * cf * lf);

    lastRange = { lo, hi };
    renderPrice();

    console.log('CALC OK:', { s, z, c, l, lo, hi, currency: getEl('currency').value });
  } catch(err) {
    console.error('CALC ERROR:', err);
  }
}

function renderPrice(){
  const cur = getEl('currency').value;
  const rate = rates[cur] || 1;
  const sym = symbols[cur] || '';
  const lo = Math.round(lastRange.lo * rate);
  const hi = Math.round(lastRange.hi * rate);
  getEl('price').textContent = `${sym} ${lo.toLocaleString('en-US')}–${hi.toLocaleString('en-US')}`;
}

function language(lang){
  const dict = T[lang] || T.az;
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-t]').forEach(el => {
    const k = el.dataset.t;
    if (dict[k] !== undefined) el.textContent = dict[k];
  });
  document.querySelectorAll('[data-html]').forEach(el => {
    const k = el.dataset.html;
    if (dict[k] !== undefined) el.innerHTML = dict[k];
  });
  ['service','size','condition','level'].forEach(id => {
    const el = getEl(id);
    if (!el) return;
    Array.from(el.options).forEach(o => {
      const k = o.dataset.t;
      if (k && dict[k] !== undefined) o.textContent = dict[k];
    });
  });
}

/* Events */
getEl('lang').addEventListener('change', e => language(e.target.value));
getEl('currency').addEventListener('change', renderPrice);
getEl('calculate').addEventListener('click', calc);

/* Init */
document.getElementById('year').textContent = new Date().getFullYear();
language('az');
calc();
</script>
